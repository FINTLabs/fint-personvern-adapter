- op: replace
  path: /spec/env
  value:
    - name: JAVA_TOOL_OPTIONS
      value: '-XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75'
    - name: fint.adapter.base-url
      value: 'https://beta.felleskomponent.no'
    - name: FINT_ADAPTER_TENANTS_0_ORGID
      value: 'agderfk.no'
    - name: FINT_ADAPTER_TENANTS_0_ID
      value: 'https://vigoiks.no/agderfk-no/personvern'
    - name: FINT_ADAPTER_TENANTS_0_USERNAME
      valueFrom:
        secretKeyRef:
          name: personvern-adapter-agderfk-no
          key: fint.core.oauth2.username
    - name: FINT_ADAPTER_TENANTS_0_PASSWORD
      valueFrom:
        secretKeyRef:
          name: personvern-adapter-agderfk-no
          key: fint.core.oauth2.password
