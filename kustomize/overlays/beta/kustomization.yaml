apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: novari-no
resources:
  - ../../base
patches:
  - target:
      kind: Application
      name: fint-personvern-adapter
    patch: |-
      - op: replace
        path: /spec/onePassword/itemPath
        value: vaults/aks-beta-vault/items/fint-personvern-adapter
      - op: replace
        path: /spec/env/1/value
        value: https://beta.felleskomponent.no
