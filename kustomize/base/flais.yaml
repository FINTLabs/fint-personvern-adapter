apiVersion: fintlabs.no/v1alpha1
kind: Application
metadata:
  name: fint-personvern-adapter
  namespace: novari-no
  labels:
    app.kubernetes.io/name: fint-personvern-adapter
    app.kubernetes.io/instance: fint-personvern-adapter_novari_no
    app.kubernetes.io/version: latest
    app.kubernetes.io/component: adapter
    app.kubernetes.io/part-of: fint-core
    fintlabs.no/team: core
    fintlabs.no/org-id: novari.no
spec:
  port: 8080
  imagePullPolicy: Always
  orgId: novari.no
  image: ghcr.io/fintlabs/fint-personvern-adapter:sha-0000000
  # Tenant credentials come from the 1Password item (fields FINT_ADAPTER_TENANTS_<n>_*), injected as env.
  onePassword:
    itemPath: vaults/aks-beta-vault/items/fint-personvern-adapter
  # The operator creates the database user and injects fint.database.url/username/password.
  database:
    enabled: true
    database: fint-core
  env:
    - name: JAVA_TOOL_OPTIONS
      value: '-XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75'
    - name: fint.adapter.base-url
      value: 'https://beta.felleskomponent.no'
  resources:
    limits:
      memory: "1Gi"
      cpu: "500m"
    requests:
      memory: "1Gi"
      cpu: "100m"
  restartPolicy: Always
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
