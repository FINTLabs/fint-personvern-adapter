apiVersion: fintlabs.no/v1alpha1
kind: Application
metadata:
  name: fint-personvern-adapter
  namespace: fintlabs-no
  labels:
    app.kubernetes.io/name: fint-personvern-adapter
    app.kubernetes.io/instance: fint-personvern-adapter_fintlabs_no
    app.kubernetes.io/version: latest
    app.kubernetes.io/component: adapter
    app.kubernetes.io/part-of: fint-core
    fintlabs.no/team: core
    fintlabs.no/org-id: fintlabs.no
spec:
  port: 8080
  imagePullPolicy: Always
  orgId: fintlabs.no
  image: ghcr.io/fintlabs/fint-personvern-adapter:sha-0000000
  # env is replaced per environment by the generated overlay (gateway URL and one tenant per org).
  env:
    - name: JAVA_TOOL_OPTIONS
      value: '-XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75'
  envFrom:
    - secretRef:
        name: fint-personvern-adapter-pg
  resources:
    limits:
      memory: "1Gi"
      cpu: "500m"
    requests:
      memory: "1Gi"
      cpu: "100m"
  restartPolicy: Always
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
