name: CD

on:
  workflow_call:
    inputs:
      cluster:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha,enable=true,priority=100,prefix=shaF-,suffix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # One deployment per cluster: the adapter serves every org as a tenant from the fintlabs-no namespace.
  deploy-to-aks:
    name: deploy to ${{ inputs.cluster }}
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    permissions:
      contents: read
      packages: write
    env:
      NAMESPACE: fintlabs-no

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get environment
        uses: actions/github-script@v8
        id: environment
        with:
          script: return '${{ inputs.cluster }}'.split('-')[1]
          result-encoding: string

      - name: Get resource group name
        uses: actions/github-script@v8
        id: resource-group
        with:
          script: return 'rg-aks-${{ steps.environment.outputs.result }}'
          result-encoding: string

      - name: Update image tag
        run: |
          sed -i "s|image: ghcr.io/fintlabs/fint-personvern-adapter:.*|image: ${{ needs.build-and-push.outputs.tags }}|" kustomize/base/flais.yaml

      - name: Bake manifests with Kustomize
        id: bake
        uses: azure/k8s-bake@v4
        with:
          renderEngine: 'kustomize'
          kustomizationPath: 'kustomize/overlays/${{ steps.environment.outputs.result }}'

      - uses: azure/login@v3
        with:
          creds: "${{ secrets[format('AKS_{0}_FINT_GITHUB', steps.environment.outputs.result)] }}"

      - uses: azure/use-kubelogin@v1.3
        with:
          kubelogin-version: 'v0.0.26'

      - name: Set the target cluster
        uses: azure/aks-set-context@v5
        with:
          cluster-name: '${{ inputs.cluster }}'
          resource-group: '${{ steps.resource-group.outputs.result }}'
          admin: 'true'
          use-kubelogin: 'true'

      - name: Create Namespace if it doesn't exist
        run: |
          if ! kubectl get namespace "$NAMESPACE"; then
            kubectl create namespace "$NAMESPACE"
          fi

      - name: Deploy
        uses: azure/k8s-deploy@v6
        with:
          action: deploy
          manifests: ${{ steps.bake.outputs.manifestsBundle }}
          namespace: ${{ env.NAMESPACE }}
