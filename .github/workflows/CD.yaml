name: CD

# develop deploys to beta, main deploys to api (production), like fint-core.
# Alpha, or a re-deploy of any environment, is started by hand.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy the current branch to'
        required: true
        type: choice
        options: [alpha, beta, api]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/fintlabs/fint-personvern-adapter
  NAMESPACE: fintlabs-no

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Map branch to environment
        id: env
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$GITHUB_REF_NAME" in
            main)    echo "environment=api"  >> "$GITHUB_OUTPUT" ;;
            develop) echo "environment=beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "no environment for branch $GITHUB_REF_NAME"; exit 1 ;;
          esac

      - name: Resolve image tag
        id: image
        run: echo "image=${IMAGE_NAME}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.setup.outputs.image }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether ${{ env.IMAGE }} already exists
        id: exists
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE already in registry, skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.exists.outputs.exists == 'false'

      - name: Build and push
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ needs.setup.outputs.environment }}
    env:
      ENVIRONMENT: ${{ needs.setup.outputs.environment }}
      IMAGE: ${{ needs.setup.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve cluster and resource group
        id: aks
        run: |
          case "$ENVIRONMENT" in
            alpha) echo "cluster=aks-alpha-fint-2021-11-18" >> "$GITHUB_OUTPUT" ;;
            beta)  echo "cluster=aks-beta-fint-2021-11-23"  >> "$GITHUB_OUTPUT" ;;
            api)   echo "cluster=aks-api-fint-2022-02-08"   >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown environment $ENVIRONMENT"; exit 1 ;;
          esac
          echo "resource-group=rg-aks-$ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Set image in the base manifest
        run: |
          sed -i "s|image: ghcr.io/fintlabs/fint-personvern-adapter:.*|image: ${IMAGE}|" kustomize/base/flais.yaml

      - name: Bake manifests with Kustomize
        id: bake
        uses: azure/k8s-bake@v4
        with:
          renderEngine: 'kustomize'
          kustomizationPath: 'kustomize/overlays/${{ env.ENVIRONMENT }}'

      - uses: azure/login@v3
        with:
          creds: "${{ secrets[format('AKS_{0}_FINT_GITHUB', env.ENVIRONMENT)] }}"

      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.0.26'

      - name: Set the target cluster
        uses: azure/aks-set-context@v5
        with:
          cluster-name: '${{ steps.aks.outputs.cluster }}'
          resource-group: '${{ steps.aks.outputs.resource-group }}'
          admin: 'true'
          use-kubelogin: 'true'

      - name: Ensure namespace ${{ env.NAMESPACE }}
        run: kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        uses: azure/k8s-deploy@v6
        with:
          action: deploy
          manifests: ${{ steps.bake.outputs.manifestsBundle }}
          namespace: ${{ env.NAMESPACE }}
