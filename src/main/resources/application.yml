fint:
  adapter:
    base-url: https://alpha.felleskomponent.no
    token-uri: https://idp.felleskomponent.no/nidp/oauth/nam/token
    heartbeat-interval: 1m
    event-poll-interval: 1s
    full-sync-initial-delay: 10s
    page-size: 100
    capabilities:
      samtykke:
        domain-name: personvern
        package-name: samtykke
        resource-name: samtykke
        full-sync-interval-in-days: 1
        delta-sync-interval: IMMEDIATE
      behandling:
        domain-name: personvern
        package-name: samtykke
        resource-name: behandling
        full-sync-interval-in-days: 1
        delta-sync-interval: IMMEDIATE
      tjeneste:
        domain-name: personvern
        package-name: samtykke
        resource-name: tjeneste
        full-sync-interval-in-days: 1
        delta-sync-interval: IMMEDIATE
      behandlingsgrunnlag:
        domain-name: personvern
        package-name: kodeverk
        resource-name: behandlingsgrunnlag
        full-sync-interval-in-days: 1
        delta-sync-interval: IMMEDIATE
      personopplysning:
        domain-name: personvern
        package-name: kodeverk
        resource-name: personopplysning
        full-sync-interval-in-days: 1
        delta-sync-interval: IMMEDIATE
    # Default: a single tenant from the credentials a FintAdapter secret provides. A deployment with several
    # tenants replaces the whole list through FINT_ADAPTER_TENANTS_<n>_* environment variables.
    tenants:
      - org-id: ${fint.adapter.org-id:fintlabs.no}
        id: ${fint.adapter.id:https://vigoiks.no/fintlabs-no/personvern}
        username: ${fint.core.oauth2.username:}
        password: ${fint.core.oauth2.password:}
        client-id: ${fint.core.oauth2.client-id:}
        client-secret: ${fint.core.oauth2.client-secret:}

spring:
  profiles:
    include:
      - db
