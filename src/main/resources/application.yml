fint:
  adapter:
    base-url: https://alpha.felleskomponent.no
    token-uri: https://idp.felleskomponent.no/nidp/oauth/nam/token?resourceServer=fint-api
    heartbeat-interval: 1m
    event-poll-interval: 1s
    full-sync-initial-delay: 10s
    page-size: 100
    # Resources are the ResourceSource beans; per-resource settings are optional, e.g.
    # capabilities.samtykke.full-sync-interval-in-days: 7
    # Default: a single credential serving one org, from the keys a FintAdapter secret provides. A deployment
    # with several credentials replaces the whole list through FINT_ADAPTER_TENANTS_<n>_* environment variables.
    tenants:
      - orgs: ${fint.adapter.org-id:fintlabs.no}
        id: ${fint.adapter.id:https://vigoiks.no/fintlabs-no/personvern}
        username: ${fint.core.oauth2.username:}
        password: ${fint.core.oauth2.password:}
        client-id: ${fint.core.oauth2.client-id:}
        client-secret: ${fint.core.oauth2.client-secret:}

spring:
  profiles:
    include:
      - db
