fint:
  database:
    url: jdbc:postgresql://localhost:5432/test
    username: postgres
    password: postgres
  adapter:
    base-url: http://localhost:8081
    full-sync-interval: 10m
    debug: true
    tenants:
      - orgs: ${FINT_ORGS:fintlabs.no}
        id: https://vigoiks.no/fintlabs-no/personvern-local
        username: ${FINT_USERNAME:test}
        password: ${FINT_PASSWORD:test}
        client-id: ${FINT_CLIENT_ID:test}
        client-secret: ${FINT_CLIENT_SECRET:test}

spring:
  datasource:
    hikari:
      schema: public

server:
  port: 8083
